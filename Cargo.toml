[workspace]
resolver = "2"
members = ["crates/tarloupe-core", "crates/tarloupe-cli", "crates/tarloupe-corpus"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jkobierczynski/tarloupe"

[workspace.dependencies]
tarloupe-core = { path = "crates/tarloupe-core" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.42", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dirs = "7"
tempfile = "3"
libz-rs-sys = "0.6"
