[package]
name = "tarloupe-cli"
description = "Command-line front end for Tarloupe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tarloupe"
path = "src/main.rs"

# Runs "Browse with Tarloupe" from Explorer without a console window.
[[bin]]
name = "tarloupew"
path = "src/bin/tarloupew.rs"

[dependencies]
tarloupe-core.workspace = true
anyhow.workspace = true
clap.workspace = true

[target.'cfg(windows)'.dependencies]
tarloupe-winfsp.workspace = true
ctrlc = "3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winfsp = { version = "0.13", default-features = false, features = ["delayload"] }
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true
tarloupe-corpus = { path = "../tarloupe-corpus" }
zstd-safe = { version = "8", default-features = false, features = ["std"] }
bzip2 = "0.6"
rusqlite.workspace = true
