[package]
name = "tarloupe-core"
description = "Platform-neutral core of Tarloupe: tar walker, persistent seek index, and random-access reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
rusqlite.workspace = true
xxhash-rust.workspace = true
dirs.workspace = true
libz-rs-sys.workspace = true
zstd-safe = { version = "8", default-features = false, features = ["std"] }
liblzma-sys = { version = "0.4", default-features = false, features = ["static", "parallel"] }
bzip2 = "0.6"

[dev-dependencies]
tempfile.workspace = true
