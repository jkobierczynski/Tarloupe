[package]
name = "tarloupe-winfsp"
description = "Read-only WinFsp file system that shows a tar archive as a folder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(windows)'.dependencies]
tarloupe-core.workspace = true
# WinFsp's own API uses windows 0.61; this feature adds the 0.62 conversions.
winfsp = { version = "0.13", features = ["windows-62"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

