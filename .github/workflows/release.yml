name: Release

# Pushing a tag like v0.1.0 builds the Windows installers, tests them on a
# clean runner and attaches them to a draft release. Nothing is public until
# someone publishes the draft on GitHub.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # No build cache: release builds start from a clean tree.
      - name: Check the tag matches the version and has notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $m = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $m.Matches[0].Groups[1].Value
          if ($tag -ne "v$version") { throw "tag $tag does not match version $version in Cargo.toml" }
          if (-not (Test-Path "release-notes/$tag.md")) { throw "release-notes/$tag.md is missing" }
      - name: Build the installers
        run: ./installer/build.ps1
      - name: Install, check and uninstall
        run: ./installer/test.ps1 -Setup (Get-ChildItem dist/tarloupe-setup-*-x64.exe).FullName
      - name: Checksums
        working-directory: dist
        run: |
          Get-ChildItem *.exe, *.msi | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/*.exe
            dist/*.msi
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # Only this job can write to the repository; it runs no project code.
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: release-notes
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Tarloupe ${TAG#v}" --notes-file "release-notes/$TAG.md" \
            dist/*.exe dist/*.msi dist/SHA256SUMS.txt
