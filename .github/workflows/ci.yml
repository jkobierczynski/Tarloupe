name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The mount test needs WinFsp; with it installed the test must run.
      - name: Install WinFsp
        if: runner.os == 'Windows'
        run: |
          choco install winfsp -y --no-progress
          echo "TARLOUPE_REQUIRE_WINFSP=1" >> $env:GITHUB_ENV
          echo "TARLOUPE_TEST_REGISTRY=1" >> $env:GITHUB_ENV
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked

  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --locked

  # Builds the MSI and the setup program that bundles WinFsp, installs it on
  # a clean runner, mounts an archive with the bundled WinFsp, uninstalls.
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The runner has the .NET SDK, which the script uses to get WiX.
      - name: Build the installers
        run: ./installer/build.ps1
      - name: Install, check and uninstall
        run: ./installer/test.ps1 -Setup (Get-ChildItem dist/tarloupe-setup-*-x64.exe).FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarloupe-installers
          path: |
            dist/*.msi
            dist/*.exe
          if-no-files-found: ignore
