version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Its refs name Rust toolchains, not releases of the action: the MSRV
      # job pins @1.89.0 to match rust-version, and @stable must stay as is.
      - dependency-name: dtolnay/rust-toolchain
